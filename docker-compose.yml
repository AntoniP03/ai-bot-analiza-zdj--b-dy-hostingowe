version: "3.9"

services:
  fastapi:
    build: ./fastapi
    container_name: ai-bot
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8020:8000"
    env_file:
      - .env
    volumes:
      - /opt/ai-bot/fastapi/main.py:/app/main.py
    networks:
      - default
      - wordpress_net

networks:
  wordpress_net:
    external: true
    name: wordpress_default
